<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List · My Mini Projects</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a class="back-link" href="../../index.html">← Back to dashboard</a>

  <main class="wrap">
    <section class="panel">
      <h1>Today</h1>

      <form class="add-form">
        <input type="text" placeholder="Add a task..." aria-label="New task">
        <button type="submit">Add</button>
      </form>

      <ul class="tasks">
        <li class="task done">
          <label><input type="checkbox" checked> Set up project folder</label>
        </li>
        <li class="task">
          <label><input type="checkbox"> Style the header</label>
        </li>
        <li class="task">
          <label><input type="checkbox"> Wire up the add-task button</label>
        </li>
        <li class="task">
          <label><input type="checkbox"> Save tasks to local storage</label>
        </li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
