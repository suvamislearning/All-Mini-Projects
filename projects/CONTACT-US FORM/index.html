<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT US</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
   <main>
 <section class="contact-form">
<div class="form-header">
<h1>Contact Us For Work</h1>
<p>We'd love to hear from you. Please fill out the form below
 or reach out to us using the contact
information provide</p>
</div>
<form >
  <div class="form-field">
    <label for="name">NAME</label>
    <input id="name" type="text" 
    placeholder="YOUR NAME">
  </div>
  
  <div class="form-field">
    <label for="email">EMAIL</label>
    <input id="email" type="email" 
     placeholder="YOUR EMAIL">
  </div>

  <div class="form-field">
    <label for="subject">SUBJECT</label>
    <input id="subject" type="text" 
     placeholder="Subject">
  </div>
  <div class="form-field">
    <label for="message">MESSAGE</label>
    <textarea id="message" type="text" >
        </textarea>
  </div>
  <div class="form-submit">
    <button type="submit">
        SEND MESSAGE
    </button>
  </div>
</form>
 </section>


 <section class="contact-info">
<div class="info-content">
<h1>Our Location</h1>
</div>
<div class="info-item">
    <p>123 Main Street, Anytown, CA 91234</p>
</div>
<div class="info-item">
    <p>Phone: (555) 123-4567</p>
</div>
<div class="info-item">
    <p>Email: contact@dosomecoding.com</p>
</div>
<div class="map-container">
    <img src="images/map.png">

</div>
 </section>

   </main> 
</body>
</html>
