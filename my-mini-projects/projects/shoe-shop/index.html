<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoe Shop · My Mini Projects</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a class="back-link" href="../../index.html">← Back to dashboard</a>

  <header class="shop-header">
    <h1>Stride</h1>
    <p>Everyday sneakers, made for walking further.</p>
  </header>

  <main class="grid">

    <article class="product">
      <div class="thumb">👟</div>
      <h2>Trail Runner</h2>
      <p class="desc">Lightweight grip for uneven ground.</p>
      <div class="row">
        <span class="price">$89</span>
        <button class="add">Add to cart</button>
      </div>
    </article>

    <article class="product">
      <div class="thumb">👟</div>
      <h2>City Low</h2>
      <p class="desc">Minimal profile, all-day comfort.</p>
      <div class="row">
        <span class="price">$74</span>
        <button class="add">Add to cart</button>
      </div>
    </article>

    <article class="product">
      <div class="thumb">👟</div>
      <h2>Court Classic</h2>
      <p class="desc">A retro silhouette, rebuilt.</p>
      <div class="row">
        <span class="price">$95</span>
        <button class="add">Add to cart</button>
      </div>
    </article>

    <article class="product">
      <div class="thumb">👟</div>
      <h2>Flex Knit</h2>
      <p class="desc">Stretch upper that moves with you.</p>
      <div class="row">
        <span class="price">$68</span>
        <button class="add">Add to cart</button>
      </div>
    </article>

  </main>

</body>
</html>
